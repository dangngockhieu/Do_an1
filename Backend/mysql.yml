services:
  db:
    container_name: database
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ecommerce
      MYSQL_ROOT_PASSWORD: 123456
    ports:
      - "3308:3306"
    command: --default-authentication-plugin=mysql_native_password
